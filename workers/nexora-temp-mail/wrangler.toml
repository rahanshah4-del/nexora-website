name = "nexora-temp-mail"
main = "src/index.js"
# The newest date the pinned wrangler@4.97.0 (root package.json) supports;
# see the note in the root wrangler.jsonc. Raise it together with wrangler.
compatibility_date = "2026-06-08"

# Free disposable inbox tool (https://nexorasolution.us/tools/temp-mail/).
#
# Mail path:  sender -> MX of mail.nexorasolution.us -> Cloudflare Email Routing
#             (catch-all rule: "Send to a Worker" -> nexora-temp-mail)
#             -> email() handler in src/index.js -> KV with a TTL.
# Web path:   the tool page calls the fetch() API of this same Worker.
#
# Receive only: this Worker never sends mail.
#
# One-time setup (see the README next to this file):
#   npx wrangler kv namespace create TEMP_MAIL --config workers/nexora-temp-mail/wrangler.toml
# then paste the printed id below.
[[kv_namespaces]]
binding = "TEMP_MAIL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Comma-separated list of receiving domains. Adding another domain later (for
# example if one is ever put on a disposable-domain blocklist) is only a change
# here plus the Email Routing setup for that domain.
TEMP_MAIL_DOMAINS = "mail.nexorasolution.us"
# How long a message lives. KV expires it by itself; the minimum KV allows is 60.
MESSAGE_TTL_SECONDS = "3600"
ALLOWED_ORIGINS = "https://nexorasolution.us,https://www.nexorasolution.us,http://localhost:5173"
