name = "nexora-temp-mail"
main = "src/index.js"
# The newest date the pinned wrangler@4.97.0 (root package.json) supports;
# see the note in the root wrangler.jsonc. Raise it together with wrangler.
compatibility_date = "2026-06-08"

# Free disposable inbox tool (https://nexorasolution.us/tools/temp-mail/).
#
# Mail path:  sender -> MX of mail.nexorasolution.us -> Cloudflare Email Routing
#             (catch-all rule: "Send to a Worker" -> nexora-temp-mail)
#             -> email() handler in src/index.js -> KV with a TTL.
# Web path:   the tool page calls the fetch() API of this same Worker.
#
# Receive only: this Worker never sends mail. It forwards non-temp mail to FORWARD_TO.
#
# One-time setup (see the README next to this file):
#   npx wrangler kv namespace create TEMP_MAIL --config workers/nexora-temp-mail/wrangler.toml
# (done: id below is the TEMP_MAIL namespace created on 2026-10-23).
[[kv_namespaces]]
binding = "TEMP_MAIL"
id = "3b958040c1144a619e6edca73e2bab68"

[vars]
# Comma-separated list of receiving domains. Adding another domain later (for
# example if one is ever put on a disposable-domain blocklist) is only a change
# here plus the Email Routing setup for that domain.
TEMP_MAIL_DOMAINS = "mail.nexorasolution.us"
# How long a message lives. KV expires it by itself; the minimum KV allows is 60.
MESSAGE_TTL_SECONDS = "3600"
# The zone's single Email Routing catch-all points at this Worker, so mail for
# anything other than TEMP_MAIL_DOMAINS (Nexora's real mailbox) is forwarded here.
# Must be a verified destination address in Email Routing.
FORWARD_TO = "rahanshah2@gmail.com"
# An address can be extended MAX_EXTENSIONS times by one MESSAGE_TTL_SECONDS period each,
# never past MAX_LIFETIME_SECONDS (max 86400).
MAX_EXTENSIONS = "1"
MAX_LIFETIME_SECONDS = "7200"
# Comma-separated sender domains whose mail is rejected (subdomains included).
BLOCKED_SENDER_DOMAINS = ""
# Cloudflare Turnstile: set the secret with `wrangler secret put TURNSTILE_SECRET --config workers/nexora-temp-mail/wrangler.toml`.
# TURNSTILE_SITE_KEY is public (the widget on the page reads it from /api/config).
# The captcha is enforced only while BOTH the secret and the site key are set.
TURNSTILE_SITE_KEY = "0x4AAAAAAFi82m4eP6kFKTIG"
ALLOWED_ORIGINS = "https://nexorasolution.us,https://www.nexorasolution.us,http://localhost:5173"
# Premium plan (display prices only; the charged price is the Polar product). Premium itself stays off until the
# Control Centre switch "Premium plan" is turned on.
PREMIUM_PRICE_MONTHLY = "3.99"
PREMIUM_PRICE_YEARLY = "29"
# Sender shown on Premium forwarding mail and the forwarding code (the domain must be verified in Resend).
FORWARD_FROM = "Nexora Temp Mail <support@nexorasolution.us>"
# Secret for Premium forwarding (never commit it): npx wrangler secret put RESEND_API_KEY --config workers/nexora-temp-mail/wrangler.toml
# Browser push alerts (mail arrives while the tab is closed). Run `npm run temp-mail:vapid`:
# it creates the key pair, stores the private half as the VAPID_PRIVATE_KEY secret and prints
# the public half to paste here. Push is on only while both are set.
VAPID_PUBLIC_KEY = "BCKeuRfFGhVDJYQKTihJJ9g3dvBcmYgG3ruFvnQqSPryKRlMgwkEVNKHE9w5GqK101Q1fCKaMsOGuBp5stnKiLA"
VAPID_SUBJECT = "mailto:info@nexorasolution.us"
