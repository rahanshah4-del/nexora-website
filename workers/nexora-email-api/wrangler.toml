name = "nexora-email-api"
main = "src/index.js"
compatibility_date = "2026-06-02"

[vars]
# Temp Mail is launched: refuse Nexora's own temp-mail domain as a recipient too, like every other
# disposable domain (see src/lib/disposableDomains.js).
BLOCK_OWN_TEMP_MAIL = "true"
# A copy of every message that Email Routing delivers to this Worker also goes to this mailbox (must be a
# verified destination address in Email Routing). Empty = store in the Control Centre Inbox only.
INBOX_FORWARD_TO = "rahanshah2@gmail.com"
# Automatic acknowledgement for mail to support@, hello@, info@, sales@, billing@, ai@ (workers/shared/autoReply.js). "false" switches it off.
AUTO_REPLY_ENABLED = "true"
AUTO_REPLY_DAILY_CAP = "300"
# Instant push alert for urgent mail (workers/shared/inboxAlert.js). Needs the INBOX_ALERT_SECRET secret (same value as the Firebase function secret).
INBOX_ALERT_URL = "https://us-central1-nexora-business-suite.cloudfunctions.net/pushInboxAlert"

[[d1_databases]]
binding = "EMAIL_DB"
database_name = "nexora-email-state"
database_id = "f0eed903-4c7b-45b5-9f92-c79d57b40d7f"

[[queues.producers]]
queue = "nexora-email-jobs"
binding = "EMAIL_QUEUE"

[[queues.consumers]]
queue = "nexora-email-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "nexora-email-jobs-dlq"

[[send_email]]
name = "EMAIL"
