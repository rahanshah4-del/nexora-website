name = "nexora-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-07-22"

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEFAULT_MODEL = "deepseek-v4-flash"
MAX_TOKENS = 500
RATE_LIMIT_REQUESTS = 100
RATE_LIMIT_WINDOW = 60
# Set FREE_PLAN=true to disable analytics KV writes (Free plan optimization)
# Upgrade to paid: change to FREE_PLAN=false or remove this line
FREE_PLAN = "true"
ENVIRONMENT = "production"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "AI_KV"
id = "e7d51996639b4278b21acbf3500fda6e"
preview_id = "e7d51996639b4278b21acbf3500fda6e"
