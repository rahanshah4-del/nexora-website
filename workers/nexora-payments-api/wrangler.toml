name = "nexora-payments-api"
main = "src/index.js"
compatibility_date = "2026-06-02"

[vars]
FIREBASE_PROJECT_ID = "nexora-business-suite"
FIREBASE_API_KEY = "AIzaSyDOdQnY-Vjkwdl-0F7FnuVjVB-tAO-cnWc"
APP_BASE_URL = "https://nexorasolution.us"
ALLOWED_ORIGINS = "https://nexorasolution.us,https://www.nexorasolution.us,https://nexorasolution.online,https://www.nexorasolution.online,http://localhost:5173,http://127.0.0.1:5173"
PKR_PER_USD = "278.2732"
PADDLE_SANDBOX = "false"
# Lemon Squeezy. Stays in test mode until the store is activated; flip to "false" for live.
LEMONSQUEEZY_TEST_MODE = "true"
LEMONSQUEEZY_STORE_ID = "497607"
# { "<variantId>": { "plan": "basic" | "standard", "cycle": "monthly" | "yearly" } }
LEMONSQUEEZY_VARIANT_MAP = '{"2246987":{"plan":"basic","cycle":"monthly"},"2246992":{"plan":"basic","cycle":"yearly"},"2246996":{"plan":"standard","cycle":"monthly"},"2247003":{"plan":"standard","cycle":"yearly"}}'
# Polar.sh (Merchant of Record). "production" uses api.polar.sh, "sandbox" uses sandbox-api.polar.sh.
# Product IDs differ per server: swap POLAR_PRODUCT_MAP to the sandbox IDs when testing with POLAR_SERVER = "sandbox".
POLAR_SERVER = "production"
# { "<productId>": { "plan": "basic" | "standard", "cycle": "monthly" | "yearly" } }
POLAR_PRODUCT_MAP = '{"0b7bcd71-c0c3-42a2-bc45-c9f4946fc818":{"plan":"basic","cycle":"monthly"},"a6b8d631-6827-4b0d-9438-c5a921c84aeb":{"plan":"basic","cycle":"yearly"},"395c351f-2ea7-4568-8595-2a45d606ad2a":{"plan":"standard","cycle":"monthly"},"7d2f0496-7406-4b42-9fb4-f7e75ba87f3a":{"plan":"standard","cycle":"yearly"}}'

[[d1_databases]]
binding = "UPGRADE_DB"
database_name = "nexora-upgrade-requests"
database_id = "58ca4308-9eb6-44cb-bd76-be062d94b4b8"

[[r2_buckets]]
binding = "UPGRADE_SCREENSHOTS"
bucket_name = "nexora-upgrade-screenshots"

# Set with `wrangler secret put`; never commit values:
# NOWPAYMENTS_API_KEY
# NOWPAYMENTS_IPN_SECRET
# FIREBASE_PAYMENT_SERVICE_EMAIL
# FIREBASE_PAYMENT_SERVICE_PASSWORD
# PADDLE_API_KEY
# PADDLE_WEBHOOK_SECRET
# PADDLE_CLIENT_TOKEN
# LEMONSQUEEZY_API_KEY
# LEMONSQUEEZY_WEBHOOK_SECRET
# POLAR_ACCESS_TOKEN
# POLAR_WEBHOOK_SECRET
# (Backend admins are by Firebase UID in src/index.js ADMIN_UIDS; BACKEND_ADMIN_EMAILS is no longer read.)
# R2_PUBLIC_BASE_URL (optional, otherwise Worker screenshot route is used)
